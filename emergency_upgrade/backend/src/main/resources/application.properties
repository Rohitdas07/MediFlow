spring.application.name=mediflow-backend
server.port=${SERVER_PORT:8080}

# ---------- MySQL ----------
# Set DB_URL/DB_USERNAME/DB_PASSWORD in the environment for a real deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mediflow_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Load seed/reference data after tables are created by Hibernate.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---------- HIS Master Administrator ----------
# Change these values in production; the admin session is JWT-protected.
app.his-admin.id=${HIS_ADMIN_ID:HIS-01234}
app.his-admin.pin=${HIS_ADMIN_PIN:01234}

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForMediFlowDevelopmentOnly1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
